<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#134650">
<title>閱讀績優評選平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   設計代幣
   ========================================================= */
:root{
  --bg:#f1f4f5; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#15232b; --muted:#54636d; --faint:#87949c;
  --line:#e1e7ea; --line-strong:#c7d0d6;
  --primary:#17555f; --primary-hover:#10434c; --primary-deep:#103e47; --primary-soft:#e1eeef; --primary-ink:#ffffff;
  --accent:#b8691f; --accent-soft:#fcf0e2; --gold:#c9993f;
  --danger:#b3261e; --danger-soft:#fbe9e7; --ok:#257044; --ok-soft:#e4f3e9; --warn:#8f6000; --warn-soft:#fff3d3;
  --s5:#1f6b46; --s4:#4a8b3c; --s3:#8a7b1e; --s2:#c0661f; --s1:#b3261e;
  --radius:12px; --radius-sm:9px;
  --shadow:0 1px 1px rgba(16,40,48,.04),0 3px 12px -4px rgba(16,40,48,.10);
  --shadow-md:0 2px 4px rgba(16,40,48,.05),0 12px 28px -10px rgba(16,40,48,.20);
  --shadow-lg:0 18px 50px -8px rgba(16,40,48,.32);
  --focus:0 0 0 3px rgba(23,85,95,.32);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-head:"Noto Serif TC","Songti TC","PMingLiU","Noto Sans TC",serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
.show-m{display:none!important}
@media (max-width:760px){.hide-m{display:none!important}.show-m{display:flex!important}}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--danger);border-color:#e4b4af}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(27,38,46,.06)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn.icon.sm{width:38px}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:17px;padding:0 22px}

/* ---------- 表單 ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.field>.lbl{font-weight:500;font-size:15px}
.field .help{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;font-size:16px}
textarea.input{resize:vertical;line-height:1.7}
.input:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:52px}
.pw-wrap .btn{position:absolute;right:2px;top:2px;min-height:42px;width:44px}
.err{color:var(--danger);font-size:14px;min-height:20px}
.check{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:26px;border-radius:13px;background:var(--line-strong);position:relative;transition:.2s;flex:none}
.switch .track::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+.track{background:var(--ok)}
.switch input:checked+.track::after{left:23px}
.switch input:focus-visible+.track{box-shadow:var(--focus)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* ---------- 頂列 ---------- */
.demo-bar{background:var(--accent-soft);color:#6a3b0c;font-size:13px;text-align:center;padding:6px 16px}
.demo-bar .d-short{display:none}
.topbar{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:62px}
.tb-logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;flex:none}
.tb-logo:hover{background:rgba(255,255,255,.22)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .b-short{display:none}
.brand span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-status{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:rgba(255,255,255,.14);color:#fff}
.chip.open{background:#e6f4ea;color:#14532d}
.chip.warn{background:#fff1c7;color:#6b4a00}
.chip.closed{background:#fde4e1;color:#8c1d16}
.chip.muted{background:rgba(255,255,255,.16);color:#fff}
.userbtn{color:#fff;border-color:rgba(255,255,255,.35);background:transparent}
.userbtn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.menu{position:fixed;right:12px;top:64px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:220px;padding:6px;z-index:60}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;min-height:46px}
.menu button:hover{background:var(--surface-2)}
.menu .who{padding:8px 12px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}
@media (max-width:760px){
  .demo-bar{font-size:12px;padding:4px 12px}.demo-bar .d-long{display:none}.demo-bar .d-short{display:inline}
  .topbar-in{flex-wrap:wrap;gap:6px 10px;padding:8px 12px 8px;min-height:0}
  .tb-logo{width:36px;height:36px}
  .brand .b-long{display:none}.brand .b-short{display:block;font-size:16px}
  .brand span{display:none}
  #userBtn{width:40px;min-height:36px;padding:0}
  #userBtn span{display:none}
  .tb-status{order:3;flex-basis:100%;gap:6px;overflow-x:auto;scrollbar-width:none}
  .tb-status .chip{font-size:12px;padding:3px 9px}
}

/* ---------- 版面 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 72px}
.wrap.narrow{max-width:860px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{margin:0;font-size:24px;line-height:1.3}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.card h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;margin-bottom:16px}
.notice.info{background:var(--primary-soft);color:#123f47}
.notice.warn{background:var(--warn-soft);color:#5e4100}
.notice.danger{background:var(--danger-soft);color:#7c1a14}
.notice.ok{background:var(--ok-soft);color:#14532d}
.notice svg{margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.spacer{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.skeleton{height:110px;border-radius:var(--radius);background:linear-gradient(90deg,#ebe7de 25%,#f3f0e9 50%,#ebe7de 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:760px){
  .wrap{padding:16px 14px 96px}
  .page-head{margin-bottom:12px}
  .page-head h1{font-size:21px}
  .page-head p{font-size:14px}
  .card{padding:16px;border-radius:12px}
}

/* ---------- 登入 ---------- */
.auth-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:
  radial-gradient(1200px 500px at 10% -10%,#dcebea 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#f4e4cf 0,transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:32px 28px}
.auth-card .logo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;margin-bottom:16px}
.auth-card .logo svg{width:28px;height:28px}
.auth-card h1{font-size:20px;line-height:1.45;margin:0 0 4px}
.auth-card .sub{color:var(--muted);margin:0 0 24px;font-size:15px}
.demo-acc{margin-top:20px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);font-size:13px;color:#6a3b0c}
.demo-acc code{background:#fff;padding:1px 6px;border-radius:4px}
@media (max-width:480px){.auth-card{padding:26px 20px;border-radius:16px}}

/* ---------- 類別頁籤 ---------- */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 12px;scrollbar-width:thin;scroll-snap-type:x proximity}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 16px 12px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;cursor:pointer;min-width:160px;text-align:left;scroll-snap-align:start;box-shadow:var(--shadow)}
.tab b{font-size:15px;line-height:1.35}
.tab .prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tab[aria-selected=true]{border-color:var(--primary);background:var(--primary);color:#fff}
.tab[aria-selected=true] .prog{color:rgba(255,255,255,.88)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.tab[aria-selected=true] .bar{background:rgba(255,255,255,.28)}
.tab[aria-selected=true] .bar>i{background:#fff}
@media (max-width:760px){.tabs{margin:0 -14px 10px;padding:2px 14px 6px}.tab{min-width:140px;padding:9px 13px 11px}.tab b{font-size:14px}}

.sumbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sumbar .sb-l{flex:1;min-width:200px}
.sumbar .sb-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sumbar .sb-t b{font-size:17px}
.sumbar .sb-t span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.sumbar{padding:12px 14px;gap:12px}.sumbar .row{width:100%}.sumbar .btn{width:100%}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:12px;top:13px;color:var(--faint)}
.search .input{padding-left:40px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 16px;min-height:44px;cursor:pointer;font-size:14px;flex:1;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--primary-soft);color:var(--primary);font-weight:700}
@media (max-width:760px){.search{max-width:none;flex-basis:100%}.seg{width:100%}}

/* ---------- 學校卡片 ---------- */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ecard{display:grid;grid-template-columns:52px minmax(0,1fr) 18px;gap:14px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 16px;cursor:pointer;box-shadow:var(--shadow);min-height:92px;transition:transform .12s,box-shadow .12s,border-color .12s}
.ecard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(27,38,46,.1);border-color:var(--line-strong)}
.ecard:active{transform:scale(.99)}
.ec-score{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line-strong);color:var(--faint);font-size:13px;font-weight:500}
.ec-score.s{border:0;color:#fff;font-size:22px;font-weight:700}
.ec-score.s5{background:var(--s5)}.ec-score.s4{background:var(--s4)}.ec-score.s3{background:var(--s3)}.ec-score.s2{background:var(--s2)}.ec-score.s1{background:var(--s1)}
.ec-body{display:flex;flex-direction:column;min-width:0;gap:1px}
.ec-body .code{font-size:13px;color:var(--muted);font-weight:500}
.ec-body .org{font-size:17px;font-weight:700;line-height:1.35}
.ec-body .nm{font-size:14px;color:var(--muted)}
.ec-body .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px;align-items:center}
.ec-body .meta span{display:inline-flex;align-items:center;gap:4px}
.ec-go{color:var(--faint)}
.draft-tag{color:#8a4b0f;background:var(--accent-soft);padding:0 8px;border-radius:999px}
@media (max-width:760px){.egrid{grid-template-columns:1fr;gap:10px}.ecard{min-height:80px;padding:12px 12px 12px 14px;gap:12px;grid-template-columns:46px minmax(0,1fr) 16px}.ec-score{width:46px;height:46px}.ec-body .org{font-size:16px}.ecard:hover{transform:none}}

/* ---------- 評分頁 ---------- */
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.crumbs .cat{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs .pos{color:var(--muted);font-size:14px;white-space:nowrap}
.ehead{margin-bottom:16px}
.ehead .code{display:inline-block;font-size:14px;font-weight:500;color:var(--primary);background:var(--primary-soft);padding:2px 10px;border-radius:999px;margin-bottom:6px}
.ehead h1{margin:0;font-size:26px;line-height:1.3}
.ehead .nm{color:var(--muted);font-size:17px;margin-top:2px}
.sstate{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap}
.sstate.ok{color:var(--ok)}
.sstate.busy{color:var(--muted)}
.sstate.err{color:var(--danger)}
.sstate.warn{color:var(--warn)}
.mini-spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;border:2px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;transition:.12s;padding:8px 2px}
.sbtn .n{font-size:30px;font-weight:700;line-height:1}
.sbtn .l{font-size:14px;color:var(--muted);white-space:nowrap}
.sbtn:hover:not(:disabled){border-color:var(--line-strong);transform:translateY(-1px)}
.sbtn[aria-checked=true]{color:#fff;transform:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.sbtn[aria-checked=true] .l{color:rgba(255,255,255,.95)}
.sbtn[data-v="5"][aria-checked=true]{background:var(--s5);border-color:var(--s5)}
.sbtn[data-v="4"][aria-checked=true]{background:var(--s4);border-color:var(--s4)}
.sbtn[data-v="3"][aria-checked=true]{background:var(--s3);border-color:var(--s3)}
.sbtn[data-v="2"][aria-checked=true]{background:var(--s2);border-color:var(--s2)}
.sbtn[data-v="1"][aria-checked=true]{background:var(--s1);border-color:var(--s1)}
.sbtn:disabled{cursor:not-allowed;opacity:.55}
.scale-foot{display:flex;justify-content:flex-end;margin-top:6px;min-height:38px}
.kbd{display:inline-block;font-size:12px;padding:0 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:#fff;color:var(--muted)}
.clist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.citem{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 12px;padding:12px 12px 10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.citem .no{grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.citem .tx{white-space:pre-wrap;word-break:break-word;line-height:1.7}
.citem .cfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.citem .acts{display:flex;gap:2px;margin-left:auto}
.citem textarea{min-height:90px}
.citem.saving{border-style:dashed}
.citem.err{border-color:#efc4bf;background:var(--danger-soft)}
.composer{border:1.5px solid var(--line-strong);border-radius:var(--radius);background:#fff;padding:12px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--primary);box-shadow:var(--focus)}
.composer .cl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px}
.composer textarea{border:0;width:100%;min-height:110px;resize:vertical;padding:4px 2px;outline:none;background:transparent;line-height:1.7;font-size:16px}
.composer .bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.efoot{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));display:none;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.mbar .btn{flex:1}
.mbar .pos{font-size:14px;color:var(--muted);min-width:56px;text-align:center}
@media (max-width:760px){
  .ehead h1{font-size:22px}.ehead .nm{font-size:15px}
  .scale{gap:6px}.sbtn{min-height:76px;border-radius:12px;gap:3px}.sbtn .n{font-size:25px}.sbtn .l{font-size:11.5px}
  .composer textarea{min-height:130px}
  .composer .bar2 .btn.primary{flex:1}
}
@media (hover:none){.kbd-hint{display:none}}
@media (max-width:760px){
  .composer textarea,.citem textarea{font-size:18px;line-height:1.75}
  .citem .tx{font-size:17px}
  .input,select.input{font-size:17px}
  .card .sub{font-size:15px}
}
.crit{margin:0 0 16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}

/* ---------- 投影即時排名 ---------- */
.live{height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(1200px 600px at 0% 0%,#1f5560 0,transparent 60%),#0d2228;color:#fff;padding:clamp(16px,2.5vw,40px);display:flex;flex-direction:column;gap:clamp(10px,1.4vw,20px);position:relative}
.live:fullscreen{overflow:auto}
.lv-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.lv-t{font-size:clamp(14px,1.3vw,22px);opacity:.75}
.lv-h h1{margin:4px 0 0;font-size:clamp(26px,3.2vw,56px);line-height:1.2;letter-spacing:.02em}
.lv-clock{font-size:clamp(22px,2.6vw,44px);font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.lv-ctrl{position:absolute;top:10px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;background:rgba(255,255,255,.95);color:var(--ink);padding:8px 10px;border-radius:12px;box-shadow:var(--shadow-lg);transition:opacity .3s;z-index:5;max-width:calc(100% - 24px)}
.lv-ctrl select.input{width:auto;min-height:38px;padding:4px 8px;font-size:14px}
.lv-ctrl .check{font-size:14px;min-height:34px}
.live.idle .lv-ctrl{opacity:0;pointer-events:none}
.live.idle{cursor:none}
.lv-meta{display:flex;flex-wrap:wrap;gap:8px}
.lv-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:clamp(13px,1.1vw,18px)}
.lv-chip.ok{background:rgba(110,231,160,.18);color:#b8f5cf}
.lv-chip.strong{background:#fff;color:#0d2228;font-weight:700}
.lv-dot{width:8px;height:8px;border-radius:50%;background:#f5c56b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.lv-list{--rh:72px;list-style:none;margin:0;padding:0;display:grid;gap:clamp(6px,.8vw,12px);flex:1;min-height:0;align-content:start}
.lv-list.two{grid-auto-flow:column;grid-template-columns:1fr 1fr;column-gap:clamp(12px,2vw,32px)}
.lv-row{height:var(--rh);display:grid;grid-template-columns:calc(var(--rh) * .78) minmax(0,1.3fr) minmax(60px,1fr) clamp(80px,8vw,140px);gap:clamp(10px,1.2vw,20px);align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:min(14px,calc(var(--rh) * .2));padding:0 clamp(10px,1.2vw,18px)}
.lv-rank{display:grid;place-items:center;width:min(58px,calc(var(--rh) * .66));height:min(58px,calc(var(--rh) * .66));border-radius:50%;background:rgba(255,255,255,.12);font-weight:700;font-size:min(30px,calc(var(--rh) * .34))}
.lv-row.top1 .lv-rank{background:linear-gradient(135deg,#ffe08a,#e0a81e);color:#3d2a00}
.lv-row.top2 .lv-rank{background:linear-gradient(135deg,#f1f3f5,#aab3bb);color:#1d2a33}
.lv-row.top3 .lv-rank{background:linear-gradient(135deg,#f3c9a2,#b97a45);color:#3a1f08}
.lv-row.top1{border-color:rgba(255,224,138,.5);background:rgba(255,224,138,.1)}
.lv-row.none{opacity:.45}
.lv-name{display:flex;flex-direction:column;min-width:0}
.lv-name small{font-size:clamp(11px,calc(var(--rh) * .2),16px);opacity:.7;line-height:1.2}
.lv-name b{font-size:clamp(14px,calc(var(--rh) * .36),30px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-name em{font-style:normal;font-weight:400;opacity:.8;margin-left:.5em;font-size:.8em}
.lv-bar{height:clamp(10px,1vw,16px);background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.lv-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4fb39a,#9be2c3);transition:width .8s cubic-bezier(.2,.8,.2,1)}

@media (max-width:760px){.live{height:auto;min-height:100dvh;overflow:visible}.lv-list{--rh:64px!important}.lv-list.two{grid-auto-flow:row;grid-template-columns:1fr;grid-template-rows:none!important}.lv-row{grid-template-columns:44px minmax(0,1fr) 72px}.lv-bar{display:none}.lv-ctrl{position:static;max-width:none}}
.gap-badge{background:var(--warn-soft);color:var(--warn);border-color:#f0d58a}

/* ---------- 匯出頁 ---------- */
.xlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.xlayout>*{min-width:0}
.paper-wrap{background:#e7e3d9;border-radius:var(--radius);padding:20px;overflow:auto;border:1px solid var(--line)}
.paper-scale{margin:0 auto;overflow:hidden}
.paper{background:#fff;width:210mm;min-height:297mm;padding:12.7mm;margin:0;box-shadow:0 2px 12px rgba(0,0,0,.15);transform-origin:0 0}
.paper.land{width:297mm;min-height:210mm}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:16px}
.side .card+.card{margin-top:0}

.sigpad.has{border-style:solid;border-color:var(--primary)}

@media (max-width:1000px){.xlayout{grid-template-columns:1fr}.side{position:static;order:-1}.paper-wrap{padding:10px}}

/* ---------- 管理後台 ---------- */
.alayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.anav{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px}
.anav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);text-decoration:none;color:var(--ink);font-weight:500;min-height:46px}
.anav a:hover{background:rgba(27,38,46,.05)}
.anav a[aria-current=page]{background:var(--primary);color:#fff}
@media (max-width:860px){.alayout{grid-template-columns:1fr;gap:12px}.anav{position:static;flex-direction:row;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}.anav a{flex:none;background:#fff;border:1px solid var(--line);min-height:42px;padding:8px 14px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:700;line-height:1.3}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--surface-2);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:center}
.tbl tbody tr:hover{background:#fcfbf8}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:28px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.s{color:#fff;border-color:transparent}
.pill.s5{background:var(--s5)}.pill.s4{background:var(--s4)}.pill.s3{background:var(--s3)}.pill.s2{background:var(--s2)}.pill.s1{background:var(--s1)}
.catitem{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;cursor:pointer;text-align:left;width:100%;min-height:56px}
.catitem[aria-current=true]{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary);background:var(--primary-soft)}
.catitem .t{flex:1;min-width:0}
.catitem .t{overflow:hidden}
.catitem .t b{display:block;overflow-wrap:anywhere}
.catitem .btn{flex:none}
@media (max-width:560px){.catitem{flex-wrap:wrap}.catitem .t{flex-basis:100%}.catitem .btn:first-of-type{margin-left:auto}}
.catitem .t span{font-size:13px;color:var(--muted)}
.catlist{display:flex;flex-direction:column;gap:8px}
.cgrid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.cgrid>*,.alayout>*{min-width:0}
@media (max-width:1180px){.cgrid{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:#bfe0cb}
.badge.off{background:var(--danger-soft);color:var(--danger);border-color:#efc4bf}
.badge.adm{background:var(--accent-soft);color:#7a4310;border-color:#f0d3b0}
.mini-prog{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- Modal / Toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,34,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal header{padding:18px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal header h2{margin:0;font-size:19px}
.modal .mb{padding:8px 20px 8px;overflow:auto}
.modal footer{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.modal blockquote{margin:8px 0;padding:10px 12px;background:var(--surface-2);border-left:3px solid var(--line-strong);border-radius:6px;white-space:pre-wrap;max-height:140px;overflow:auto}
@media (max-width:560px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92dvh;padding-bottom:var(--safe-b)}
  .modal footer{flex-direction:column-reverse}
  .modal footer .btn{width:100%}
}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.toast{pointer-events:auto;background:#1f2b33;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:15px;display:flex;gap:10px;align-items:center;animation:pop .2s}
.toast.error{background:var(--danger)}
.toast.ok{background:var(--ok)}
@media (max-width:760px){.toasts{bottom:calc(84px + var(--safe-b))}}
.busy{position:fixed;inset:0;z-index:150;background:rgba(255,255,255,.78);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:500}
.spinner{width:40px;height:40px;border:4px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* =========================================================
   視覺精修：沉穩的墨青＋冷灰紙色；標題用明體，資料用黑體
   ========================================================= */
body{font-feature-settings:"palt" 0;text-rendering:optimizeLegibility}
::selection{background:#cfe5e7}
*{scrollbar-width:thin;scrollbar-color:#c3cdd2 transparent}
/* 標題 */
.page-head h1,.auth-card h1,.et-id h1,.ehead h1{font-family:var(--font-head);font-weight:700;letter-spacing:.01em}
.page-head{align-items:center;margin-bottom:18px}
.page-head h1{font-size:26px}
.page-head p{font-size:14.5px;max-width:74ch}
.page-head.compact h1{font-size:24px}
.card h2{font-size:17px;font-weight:700}
/* 頂列：深墨青＋底部一道金線（獎項的金） */
.topbar{background:var(--primary-deep);box-shadow:inset 0 -2px 0 var(--gold),0 6px 18px -8px rgba(16,40,48,.45)}
.topbar-in{min-height:60px;max-width:1600px}
.tb-logo{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.brand b{font-weight:700;letter-spacing:.02em}
.brand span{opacity:.72}
.chip{font-variant-numeric:tabular-nums}
.userbtn{border-color:rgba(255,255,255,.28);border-radius:999px;padding:0 14px}
.menu{border-radius:12px;box-shadow:var(--shadow-lg)}
/* 按鈕與表單 */
.btn{border-radius:var(--radius-sm);box-shadow:0 1px 1px rgba(16,40,48,.05)}
.btn:hover{background:var(--surface-2);border-color:#9fabb3}
.btn.primary{box-shadow:0 1px 2px rgba(16,62,71,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.ghost,.btn.ghost:hover{box-shadow:none}
.btn.danger{border-color:#e6bdb8}
.btn.danger:disabled{color:var(--muted);border-color:var(--line-strong)}
.input,select.input,textarea.input{border-color:var(--line-strong);transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:#9fabb3}
.field>label:not(.check):not(.switch),.field>.lbl{font-size:14.5px;font-weight:700;color:#24343d}
.seg{box-shadow:0 1px 1px rgba(16,40,48,.05)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
/* 卡片與提示 */
.card{border-color:var(--line);box-shadow:var(--shadow)}
.rcard{padding:18px 20px}
.notice{border:1px solid transparent;border-left-width:4px;border-radius:8px}
.notice.info{border-color:#bcd9dc;border-left-color:var(--primary)}
.notice.warn{border-color:#efd9a0;border-left-color:#c9993f}
.notice.danger{border-color:#efc4bf;border-left-color:var(--danger)}
.notice.ok{border-color:#bfe0cb;border-left-color:var(--ok)}

/** 僅在內容改變時重繪，並保留鍵盤焦點 */
function setHTML(node, html) {
  if (!node || node._h === html) return;
  const a = document.activeElement, inside = a && node.contains(a);
  let key = null;
  if (inside) { const host = a.closest("[data-id],[data-entry],[data-cat],[data-eid],[data-jid],[data-cid]"); key = host && [...host.attributes].filter(x => x.name.startsWith("data-")).map(x => `[${x.name}="${x.value}"]`).join("") + (a.dataset.act ? ` [data-act="${a.dataset.act}"]` : ""); }
  node.innerHTML = html; node._h = html;
  if (key) { const n = node.querySelector(key) || node.querySelector(key.split(" ")[0]); n?.focus?.(); }
}

const SIG_THIN = 2.6, SIG_BOLD_RATIO = 2.3;

  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "sigfs"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", title);
    ov.innerHTML = `<header><button class="btn ghost" data-k="cancel">取消</button><b>${esc(title)}</b><button class="btn primary" data-k="ok" disabled>${I("check", "sm")}完成</button></header>
      <div class="sig-area"><canvas aria-label="簽名區"></canvas><div class="sig-guide">${esc(who ? who + "　" : "")}請在線上簽名</div><div class="sig-line"></div></div>
      <footer><button class="btn" data-k="undo" disabled>${I("back", "sm")}復原一筆</button><button class="btn" data-k="clear" disabled>${I("trash", "sm")}清除重寫</button><span class="hint muted small">手機可橫放，簽名空間更大</span></footer>`;
    document.body.appendChild(ov);
    const sy = scrollY, bs = document.body.style, prevCss = bs.cssText;
    Object.assign(bs, { position: "fixed", top: `-${sy}px`, left: "0", right: "0", overflow: "hidden" });
    const area = $(".sig-area", ov), cv = $("canvas", ov), ctx = cv.getContext("2d");
    let strokes = [], cur = null, W = 0, H = 0;
    function draw(c, pts, w) {
      c.lineWidth = w; c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = "#111"; c.fillStyle = "#111";
      if (pts.length === 1) { c.beginPath(); c.arc(pts[0].x, pts[0].y, w / 2, 0, Math.PI * 2); c.fill(); return; }
      c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);

      const has = strokes.length > 0; ["ok", "undo", "clear"].forEach(k => $(`[data-k=${k}]`, ov).disabled = !has); ov.classList.toggle("has", has || !!cur);
    }

      W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cv.addEventListener("pointerdown", ev => { ev.preventDefault(); try { cv.setPointerCapture(ev.pointerId); } catch {} cur = [pos(ev)]; redraw(); });

/** 依原筆跡向量重新繪製：自動裁切空白、筆畫加粗，保留書寫者的字形 */
function renderBoldSignature(strokes) {

    g.beginPath(); g.moveTo(q[0].x, q[0].y);
    for (let i = 1; i < q.length - 1; i++) g.quadraticCurveTo(q[i].x, q[i].y, (q[i].x + q[i + 1].x) / 2, (q[i].y + q[i + 1].y) / 2);

/* ---------- 總表 ---------- */
function summaryData(catId) {
  const cat = catOf(catId); if (!cat) return null;
  const ids = new Set();
  S.judges.forEach(j => { if (j.enabled && judgeCats(j).some(c => c.id === catId)) ids.add(j.id); });
  S.scores.forEach(s => { if (s.catId === catId) ids.add(s.judgeUid); });
  S.comments.forEach(c => { if (c.catId === catId) ids.add(c.judgeUid); });
  const js = [...ids].map(id => { const j = S.judges.find(x => x.id === id); return { id, name: j?.name || S.comments.find(c => c.judgeUid === id)?.judgeName || "（已移除委員）", createdAt: j?.createdAt ?? 9e15, signature: j?.signature || null }; })
    .sort((a, b) => a.createdAt - b.createdAt);
  const scIds = catScorers(cat), sj = scIds.length ? js.filter(j => scIds.includes(j.id)) : js;
  const rows = catEntries(catId).map(e => {
    const sc = sj.map(j => scoreOf(e.id, j.id)), v = sc.filter(x => x), sum = v.reduce((a, b) => a + b, 0);
    const cm = js.map(j => ({ name: j.name, list: commentsOf(e.id, j.id).map(c => c.text) })).filter(x => x.list.length);
    return { e, sc, n: v.length, sum, avg: v.length ? sum / v.length : null, cm };
  });
  const ranked = rows.filter(r => r.avg != null).sort((a, b) => b.avg - a.avg);
  ranked.forEach((r, i) => r.rank = i && Math.abs(ranked[i - 1].avg - r.avg) < 1e-9 ? ranked[i - 1].rank : i + 1);
  const res = resultOf(catId);

async function exportAllZip({ catIds, word, pdf, summary, sign }) {
  const done = busy("準備中…");
  try {
    await Promise.all([loadScript(LIB.jszip), loadScript(LIB.docx), ...(pdf || summary ? [loadScript(LIB.html2pdf)] : [])]);
    const zip = new window.JSZip(), P = window.docx.Packer;
    const jobs = [];
    catIds.forEach(cid => {
      const sd = summaryData(cid); if (!sd) return;
      const dir = safeName(`${pad2(allCats().findIndex(c => c.id === cid) + 1)}_${sd.cat.name}`);
      sd.js.forEach((j, i) => {
        const fn = `${dir}/${pad2(i + 1)}_${safeName(j.name)}`;
        const get = () => { const d = sheetData(cid, j.id); return { d, sig: sign ? j.signature : null }; };
        if (word) jobs.push([`${fn}.docx`, async () => { const { d, sig } = get(); return P.toBlob(await judgeDocx(d, sig)); }]);
        if (pdf) jobs.push([`${fn}.pdf`, async () => { const { d, sig } = get(); return makePdfBlob(sheetHTML(d, sig), false); }]);
      });
      if (summary) {
        jobs.push([`${dir}/00_評分總表.docx`, async () => P.toBlob(await summaryDocx(sd, true, sign))]);
        jobs.push([`${dir}/00_評分總表.pdf`, async () => makePdfBlob(summaryHTML(sd, true, sign), true)]);
        jobs.push([`${dir}/00_評分總表.csv`, async () => new Blob([summaryCsv(sd)], { type: "text/csv;charset=utf-8" })]);
        if (sd.res) {
          jobs.push([`${dir}/00_評定結果.docx`, async () => P.toBlob(await finalDocx(finalData(cid)))]);
          jobs.push([`${dir}/00_評定結果.pdf`, async () => makePdfBlob(finalHTML(finalData(cid)), false)]);
          jobs.push([`${dir}/00_綜合評分表.docx`, async () => { const f2 = finalData(cid); return P.toBlob(await judgeDocx(consolidatedData(f2), null, f2.sd.js)); }]);
          jobs.push([`${dir}/00_綜合評分表.pdf`, async () => { const f2 = finalData(cid); return makePdfBlob(sheetHTML(consolidatedData(f2), null, f2.sd.js), false); }]);
        }
      }
    });
    if (!jobs.length) throw new Error("沒有可輸出的委員或資料");
    for (let i = 0; i < jobs.length; i++) {
      done.set(`正在產生檔案 ${i + 1} / ${jobs.length}：${jobs[i][0].split("/").pop()}`);
      zip.file(jobs[i][0], await jobs[i][1]());
    }
    done.set("壓縮中…");
    const d = new Date(), stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    download(await zip.generateAsync({ type: "blob", compression: "DEFLATE" }), safeName(`${yearTag()}閱讀評選_評分表_${stamp}`) + ".zip");
    toast(`已下載 ZIP（共 ${jobs.length} 個檔案）`, "ok");
  } catch (e) { console.error(e); toast("打包失敗：" + e.message, "error"); } finally { done(); }
}

function previewOverlay(html, land) {
  const ov = document.createElement("div"); ov.className = "pv-fs"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
  ov.innerHTML = `<header><b>評分表預覽</b><button class="btn primary sm" data-x>${I("x", "sm")}關閉</button></header><div class="pv-body"><div class="paper ${land ? "land" : ""}"><style>${SHEET_CSS}</style>${html}</div></div>`;
  document.body.appendChild(ov); const prev = document.body.style.overflow; document.body.style.overflow = "hidden";
  const close = () => { ov.remove(); document.body.style.overflow = prev; document.removeEventListener("keydown", k, true); };
  const k = e => { if (e.key === "Escape") close(); }; document.addEventListener("keydown", k, true);
  $("[data-x]", ov).onclick = close; $("[data-x]", ov).focus();
}
function fitPaper(el) {
  const pw = $("#pw", el), p = $("#paper", el); if (!pw || !p) return;
  let box = p.parentElement;
  if (!box.classList.contains("paper-scale")) { box = document.createElement("div"); box.className = "paper-scale"; p.before(box); box.appendChild(p); }
  p.style.transform = "";
  const avail = pw.clientWidth - (innerWidth < 1000 ? 20 : 40), w = p.offsetWidth, h = p.offsetHeight, z = Math.min(1, avail / w);
  p.style.transform = z < 1 ? `scale(${z})` : "";
  box.style.width = w * z + "px"; box.style.height = h * z + "px";
}

/* ---------- 管理者：代為修改委員評分與意見（需填原因、全程紀錄、委員端標示） ---------- */
const PROXY_REASONS = ["委員口頭／電話告知修改", "委員書面資料更正", "輸入錯誤更正", "委員無法上線，代為輸入", "其他"];
Views.proxy = (el, { catId, judgeUid }) => {
  let built = false, reason = sessionStorage.getItem(`rj_px_${judgeUid}`) || "";
  const judge = () => S.judges.find(j => j.id === judgeUid);
  const tag = () => ({ editedBy: S.me?.name || "管理者", editedAt: Date.now(), editReason: reason });
  function askReason(force) {
    if (reason && !force) return Promise.resolve(true);
    return new Promise(res => { let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      openModal({ title: "代為修改的原因", dismissable: false, body: `
        <p class="sub" style="margin-top:0">修改「${esc(judge()?.name || "")}」的評分或意見前，請說明原因。原因會記錄在每一筆修改中，委員端也會看到標示。</p>
        <fieldset class="field" style="border:0;padding:0;margin:0 0 10px">${PROXY_REASONS.map((r, i) => `<label class="check"><input type="radio" name="pr" value="${esc(r)}" ${(reason.startsWith(r) || (!reason && i === 0)) ? "checked" : ""}>${esc(r)}</label>`).join("")}</fieldset>
        <div class="field"><label for="prN">補充說明（選填）</label><input class="input" id="prN" value="${esc(reason.split("：")[1] || "")}" placeholder="例：10/25 評審會議後委員要求修正"></div>`,
        actions: [{ label: "取消", onClick: () => fin(false) }, { label: "確認", kind: "primary", onClick: ov => {
          const r = $("input[name=pr]:checked", ov).value, n = $("#prN", ov).value.trim();
          if (r === "其他" && !n) { toast("選擇「其他」時請填寫補充說明", "error"); return false; }
          reason = n ? `${r}：${n}` : r; sessionStorage.setItem(`rj_px_${judgeUid}`, reason); fin(true); render();
        } }] }); });
  }
  const log = (act, o) => auditOp(act, { catId, targetUid: judgeUid, targetName: judge()?.name, ...o, detail: "原因：" + reason });
  async function setScore(eid, v) {
    if (!await askReason()) return;
    const id = `${judgeUid}_${eid}`, prev = scoreOf(eid, judgeUid);
    if (prev === v) return;
    await W(B.batch([{ op: "set", c: "scores", id, d: { judgeUid, entryId: eid, catId, score: v, updatedAt: Date.now(), ...tag() } }, log("proxy.score", { entryId: eid, from: prev ?? "", to: v })]), "已代為修改評分").catch(() => {});
  }
  async function clearScore(eid) {
    const prev = scoreOf(eid, judgeUid); if (!prev || !await askReason()) return;
    if (!await confirmDialog("清除此校的評分？")) return;
    await W(B.batch([{ op: "delete", c: "scores", id: `${judgeUid}_${eid}` }, log("proxy.clear", { entryId: eid, from: prev })]), "已清除評分").catch(() => {});
  }
  function textModal(title, val) {
    return new Promise(res => { let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      openModal({ title, dismissable: false, body: `<textarea class="input" id="pxT" rows="5" maxlength="2000">${esc(val || "")}</textarea>`,
        actions: [{ label: "取消", onClick: () => fin(null) }, { label: "儲存", kind: "primary", onClick: ov => { const v = stripNum($("#pxT", ov).value.trim()); if (!v) { toast("內容不可空白", "error"); return false; } fin(v); } }] }); });
  }
  async function addComment(eid) {
    if (!await askReason()) return; const t = await textModal(`代為新增意見（${judge()?.name}）`); if (!t) return;
    const id = B.newId("comments"), now = Date.now();
    await W(B.batch([{ op: "set", c: "comments", id, d: { entryId: eid, catId, judgeUid, judgeName: judge()?.name || "", text: t, order: now, createdAt: now, updatedAt: now, ...tag() } }, log("proxy.cadd", { entryId: eid, to: t })]), "已代為新增意見").catch(() => {});
  }
  async function editComment(cid) {
    const c = S.comments.find(x => x.id === cid); if (!c || !await askReason()) return;
    const t = await textModal(`代為修改意見（${judge()?.name}）`, c.text); if (!t || t === c.text) return;
    await W(B.batch([{ op: "update", c: "comments", id: cid, d: { text: t, updatedAt: Date.now(), ...tag() } }, log("proxy.cedit", { entryId: c.entryId, from: c.text, to: t })]), "已代為修改意見").catch(() => {});
  }
  async function delComment(cid) {
    const c = S.comments.find(x => x.id === cid); if (!c || !await askReason()) return;
    if (!await confirmDialog(`刪除此則意見？\n\n「${c.text.slice(0, 80)}」`, { ok: "刪除", danger: true })) return;
    await W(B.batch([{ op: "delete", c: "comments", id: cid }, log("proxy.cdel", { entryId: c.entryId, from: c.text })]), "已刪除").catch(() => {});
  }
  function build() {
    el.innerHTML = topbarHTML() + `<main class="wrap">
      <nav class="crumbs"><button class="btn sm" data-nav="#/admin/results">${I("back", "sm")}返回評分結果</button>
        <span class="spacer"></span><button class="btn sm" data-nav="#/export/${catId}/${judgeUid}">${I("file", "sm")}預覽此委員評分表</button></nav>
      <div class="page-head compact"><div><h1>代為修改：<span id="pxJ"></span></h1><p id="pxC"></p></div>
        <div class="row"><label class="sr-only" for="pxCat">類別</label><select class="input" id="pxCat" style="width:auto"></select></div></div>
      <div id="pxBan"></div>
      <section class="card rcard"><div class="tbl-wrap scroll"><table class="tbl dense pxtbl"><thead id="pxH"></thead><tbody id="pxB"></tbody></table></div></section></main>`;
    built = true;
    $("#pxCat", el).onchange = e => nav(`#/proxy/${e.target.value}/${judgeUid}`);
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-px]"); if (!b) return;
      const eid = b.closest("[data-eid]")?.dataset.eid, k = b.dataset.px;
      if (k === "reason") askReason(true);
      else if (k === "lv") setScore(eid, +b.dataset.v);

      else if (k === "del") delComment(b.dataset.cid);
    });
  }
  function render() {
    const j = judge(), cat = catOf(catId);
    if (!j || !cat) { el.innerHTML = topbarHTML() + `<main class="wrap"><div class="empty">找不到此委員或類別。<br><br><button class="btn" data-nav="#/admin/results">返回</button></div></main>`; built = false; return; }
    if (!built) build();
    const scorer = isScorer(catId, judgeUid), sub = subOf(catId, judgeUid)?.submitted, dbl = cat.layout === "double";
    $("#pxJ", el).textContent = j.name;
    $("#pxC", el).textContent = `${cat.name}・${scorer ? "評分＋意見" : "只寫意見"}`;
    setHTML($("#pxCat", el), judgeCats(j).map(c => `<option value="${c.id}" ${c.id === catId ? "selected" : ""}>${esc(c.name)}</option>`).join(""));
    setHTML($("#pxBan", el), `<div class="notice warn px-ban">${I("edit")}<div><b>代為修改模式</b>：每一筆修改都會記錄「修改前 → 修改後」與原因，委員端會看到「管理者代修」標示。
      <div class="px-reason">本次原因：<b>${reason ? esc(reason) : "（尚未填寫，第一次修改時會詢問）"}</b> <button class="btn sm" data-px="reason">${reason ? "變更原因" : "填寫原因"}</button></div>
      ${sub || j.signature ? `<div style="margin-top:6px">${I("alert", "sm")} 此委員${sub ? "已確認送出" : ""}${sub && j.signature ? "並" : ""}${j.signature ? "已儲存電子簽名" : ""}，修改後其評分表內容會改變，建議請委員重新確認。</div>` : ""}</div></div>`);
    setHTML($("#pxH", el), `<tr><th>編號</th><th>${esc(cat.col1Label || "學校")}</th>${dbl ? `<th>${esc(cat.col2Label)}</th>` : ""}${scorer ? `<th class="num" style="width:230px">評分（5～1）</th>` : ""}<th>審查意見</th></tr>`);
    setHTML($("#pxB", el), catEntries(catId).map(e => {
      const sc = scoreOf(e.id, judgeUid), srec = S.scores.find(s => s.id === `${judgeUid}_${e.id}`), cms = commentsOf(e.id, judgeUid);

          <button class="btn sm" data-px="add">${I("plus", "sm")}新增意見</button></td></tr>`;

  }

  function compute() {

    const use = onlySub ? subJ : sd.sj;

      return { e: r.e, n: v.length, avg: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null };
    });
    const ranked = rows.filter(r => r.avg != null).sort((a, b) => b.avg - a.avg || String(a.e.code).localeCompare(String(b.e.code)));
    ranked.forEach((r, i) => r.rank = i && Math.abs(ranked[i - 1].avg - r.avg) < 1e-9 ? ranked[i - 1].rank : i + 1);

        return `<span class="lv-chip ${sub ? "ok" : ""}">${sub ? I("check", "sm") : `<span class="lv-dot"></span>`}${esc(j.name)}${sub ? "" : `・${n}/${m.sd.rows.length}`}</span>`; }).join(""));
    const dbl = m.sd.cat.layout === "double";
    const sig = JSON.stringify(m.list.map(r => [r.e.id, r.rank, r.avg, r.n, r.award, r.level])) + showName + dbl + !!m.fin + !!m.scale;
    $("#lvFoot", el).textContent = `最後更新：${fmtDT(Date.now())}　｜　${m.fin ? "名次與等第依評審會議決議" : `平均＝${onlySub ? "已送出" : "已評分"}之評分委員平均，同分同名次`}`;
    if (sig === lastSig) return; lastSig = sig;
    // FLIP 動畫：記錄舊位置

    const two = m.list.length > 10 && innerWidth >= 900, rows = two ? Math.ceil(m.list.length / 2) : m.list.length;
    ol.classList.toggle("two", two); ol.dataset.rows = rows;
    ol.style.gridTemplateRows = two ? `repeat(${rows}, var(--rh))` : "";
    fitRows();
    ol.innerHTML = m.list.map(r => `<li class="lv-row ${r.rank && r.rank <= 3 ? "top" + r.rank : ""} ${r.avg == null ? "none" : ""}" data-id="${r.e.id}">
      <span class="lv-rank">${r.rank || "—"}</span>
      <span class="lv-name"><small>${esc(r.e.code)}</small><b>${showName ? esc(r.e.org) + (dbl && r.e.name ? `<em>${esc(r.e.name)}</em>` : "") : "（名稱隱藏）"}${r.award ? awardBadge(m.sd.cat, r.award).replace('class="awd', 'class="awd lv') : ""}</b></span>
      <span class="lv-bar"><i style="width:${m.scale ? (r.level || 0) * 20 : r.avg ? (r.avg / 5 * 100).toFixed(1) : 0}%"></i></span>
      <span class="lv-avg">${m.scale ? (r.level ? `${r.level}<small>${scaleLabel(r.level)}</small>` : "—") : `${r.avg != null ? r.avg.toFixed(2) : "—"}<small>${r.n ? `${r.n} 位` : "尚無"}</small>`}</span></li>`).join("") || `<li class="lv-empty">此類別尚無參賽資料</li>`;
    $$("[data-id]", ol).forEach(n => {
      const b = before[n.dataset.id]; if (!b) { n.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); return; }

      if (dx || dy) n.animate?.([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)" });

  /** 依螢幕高度自動調整每列高度，使排名一頁顯示完畢 */

  return {
    update: render,
    unmount() { removeEventListener("resize", onRs); document.removeEventListener("fullscreenchange", onRs); clearInterval(rotT); clearInterval(clock); clearTimeout(hideT); document.removeEventListener("visibilitychange", onVis); try { wake?.release(); } catch {} if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
  };
};

function summaryCsv(sd) {

  const rows = sd.rows.map(r => [r.e.code, r.e.org, ...(dbl ? [r.e.name] : []), ...r.sc.map(x => x ?? ""), r.n ? r.sum : "", fmtAvg(r.avg), r.rank || "", r.final || "", r.award || "", r.n,

    list.forEach((e, i) => {

      const m = ex.find(x => !used.has(x.id) && (e.code ? x.code === e.code : x.org === e.org && (x.name || "") === (e.name || "")));
      const d = { code, org: e.org, name: dbl ? e.name : "", link: e.link, order: i + 1 };
      if (m) { used.add(m.id); if (m.code !== d.code || m.org !== d.org || (m.name || "") !== d.name || (m.link || "") !== d.link || m.order !== d.order) { ops.push({ op: "update", c: "entries", id: m.id, d }); st.upd++; } else st.same++; }
      else { ops.push({ op: "set", c: "entries", id: B.newId("entries"), d: { catId, ...d } }); st.add++; }
    });

      const sc = S.scores.filter(s => s.entryId === x.id), cm = S.comments.filter(c => c.entryId === x.id);

}

function parseTSV(t) {
  const rows = []; let row = [], cell = "", q = false;
  t = String(t).replace(/\r\n?/g, "\n");
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === "") q = true;
    else if (ch === "\t") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

      return saveResult(d => { d.locked = false; d.unlockedAt = Date.now(); d.unlockedBy = S.me?.name || ""; }, [{ act: "result.unlock" }], true);
    }
    if (act === "byavg") { if (!await confirmDialog("改回依平均分數排序？目前手動調整的名次會被取代（等第保留）。")) return; return saveResult(d => { d.order = sd.rows.filter(r => r.avg != null).sort(byAvg).map(r => r.e.id); d.manual = false; }, [{ act: "result.bulk", detail: "依平均分數重新排序" }]); }

const byAvg = (a, b) => (b.avg ?? -1) - (a.avg ?? -1) || (a.e.order || 0) - (b.e.order || 0);

    const x = e.target.closest("[data-c]"); if (!x) return; const tr = x.closest("tr"), i = +tr.dataset.r, c = cols.find(k => k.k === x.dataset.c);
    if (x.tagName === "TEXTAREA") grow(x);
    if (tr.classList.contains("blank")) { const r = newRow(); r[c.k] = x.value; T.rows.push(r); render({ r: i, c: c.k }); return; }
    T.rows[i][c.k] = c.type === "select" ? x.value : x.value; markRow(tr); sync();
  });
  host.addEventListener("change", e => { const x = e.target.closest("select[data-c]"); if (!x) return; const tr = x.closest("tr"); T.rows[+tr.dataset.r][x.dataset.c] = x.value; markRow(tr); sync(); });
  host.addEventListener("focusout", e => { const x = e.target.closest("[data-c]"); if (!x || x.tagName === "SELECT") return; const tr = x.closest("tr"); const r = T.rows[+tr?.dataset.r]; const c = cols.find(k => k.k === x.dataset.c); if (r && c?.parse) { const v = c.parse(x.value); if (String(v) !== x.value) { r[c.k] = v; x.value = v; markRow(tr); sync(); } } });
  host.addEventListener("click", e => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    if (b.dataset.s === "all") { if (b.checked) T.rows.forEach((_, i) => T.sel.add(i)); else T.sel.clear(); render(); return; }
    const i = +b.closest("tr").dataset.r;
    if (e.shiftKey && T.last != null) { const [a, z] = [Math.min(T.last, i), Math.max(T.last, i)]; for (let k = a; k <= z; k++) T.sel.add(k); }
    else if (e.ctrlKey || e.metaKey) { T.sel.has(i) ? T.sel.delete(i) : T.sel.add(i); }
    else { const only = T.sel.size === 1 && T.sel.has(i); T.sel.clear(); if (!only) T.sel.add(i); }
    T.last = i; render(); $(`tr[data-r="${i}"] [data-s=row]`, host)?.focus();
  });
  host.addEventListener("paste", e => {
    const x = e.target.closest("[data-c]"); if (!x) return;
    const t = e.clipboardData?.getData("text/plain") || ""; if (!/[\t\n]/.test(t.replace(/\r?\n$/, ""))) return;
    e.preventDefault();
    const vis = cols.filter(c => !T.hidden.has(c.k)), r0 = +x.closest("tr").dataset.r, c0 = vis.findIndex(c => c.k === x.dataset.c);
    parseTSV(t).forEach((cells, j) => { if (cells.every(v => !v.trim())) return; const r = r0 + j; if (!T.rows[r]) T.rows[r] = newRow(); cells.forEach((v, k) => { const c = vis[c0 + k]; if (c) T.rows[r][c.k] = parse(c, v); }); });
    render({ r: r0, c: x.dataset.c }); toast("已貼上，請記得儲存");
  });
  host.addEventListener("copy", e => {
    if (!T.sel.size || e.target.closest("[data-c]")?.tagName.match(/INPUT|TEXTAREA/) && window.getSelection()?.toString()) return;

  });
  host.addEventListener("keydown", e => {
    const x = e.target.closest("[data-c]");
    if (!x && e.target.closest("[data-s=row]") && (e.key === "Delete" || e.key === "Backspace") && T.sel.size) { e.preventDefault(); api.delSel(); return; }
    if (!x) return;
    const tr = x.closest("tr"), r = +tr.dataset.r, multi = x.tagName === "TEXTAREA";
    const mv = d => { const n = $(`tr[data-r="${r + d}"] [data-c="${x.dataset.c}"]`, host) || $(`tr[data-r="${r + d}"] [data-c]`, host); if (n) { e.preventDefault(); n.focus(); try { n.select?.(); } catch {} } };
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) mv(1);
    else if (e.key === "ArrowDown" && (!multi || x.selectionStart === x.value.length)) mv(1);
    else if (e.key === "ArrowUp" && (!multi || x.selectionStart === 0)) mv(-1);
  });
  const tsv = rows => rows.map(r => cols.filter(c => !T.hidden.has(c.k)).map(c => String(fmt(c, r[c.k] ?? "")).replace(/\t/g, " ").replace(/\n/g, " ")).join("\t")).join("\n");
  const api = {
    load, changes, render,
    rows: () => T.rows, isBlank,
    selected: () => [...T.sel].sort((a, b) => a - b).map(i => T.rows[i]),
    setHidden(keys) { T.hidden = new Set(keys); render(); },
    add() { T.rows.push(newRow()); render({ r: T.rows.length - 1, c: cols.find(c => c.main)?.k }); },
    delSel() { if (!T.sel.size) return; const n = T.sel.size; T.rows = T.rows.filter((_, i) => !T.sel.has(i)); T.sel.clear(); render(); toast(`已刪除 ${n} 列（按「儲存」才會生效）`); },
    copySel() { if (!T.sel.size) return; const t = tsv(api.selected()); navigator.clipboard?.writeText(t).then(() => toast(`已複製 ${T.sel.size} 列，可貼到 Excel`)).catch(() => toast("請按 Ctrl+C 複製", "error")); },
    setSel(k, v) { if (!T.sel.size) return; T.sel.forEach(i => T.rows[i][k] = v); render(); },
    /** 儲存後：新列給 id、刪除空白列、更新原始快照 */
    commit(idOf, soft) {
      if (soft) {   // 輸入中自動儲存：不重繪，避免游標跳走
        T.rows.forEach(r => { if (isBlank(r)) { r.id = undefined; return; } if (!r.id) r.id = idOf(r); });
        T.orig = new Map(T.rows.filter(r => r.id).map(r => [r.id, snap(r)]));
        $$("tbody tr[data-r]", host).forEach(tr => { if (!tr.classList.contains("blank")) tr.classList.remove("chg", "new"); });
        sync(); return;
      }
      T.rows = T.rows.filter(r => !isBlank(r)); T.rows.forEach(r => { if (!r.id) r.id = idOf(r); }); T.orig = new Map(T.rows.map(r => [r.id, snap(r)])); T.sel.clear(); render();
    }
  };
  return api;
}

  /* ---- 審查指標：每個類別一個清單，一行一項 ---- */
  function buildCrit(body) {
    body.innerHTML = `<section class="card rcard"><p class="sub" style="margin-top:0">每行一項審查指標，委員評分頁右側「審查指標」會依序顯示（不會印在評分表上）。也可以在「類別與隊伍」→ 類別設定 ⚙ 修改，兩邊同步。</p>

  const markCrit = t => { const ch = t.value.split(/\n+/).map(x => stripNum(x.trim())).filter(Boolean).join("\n") !== (t.dataset.orig || ""); const box = t.closest(".crit-card"); box.classList.toggle("chg", ch); $("[data-csave]", box).disabled = !ch; $(".cc-st", box).innerHTML = ch ? `<span class="sstate warn">${I("alert", "sm")}尚未儲存</span>` : `<span class="sstate ok">${I("check", "sm")}已儲存</span>`; };
  function renderCrit(force) {

    setHTML($("#rfC", pane), `<option value="">全部類別</option>${cs.map(c => `<option ${c === f.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}`);

    setHTML($("#rfSetLv", pane), `<option value="">等級…</option>${[["0", "通用"], ...lv.map(v => [String(v), lvName(v)])].map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}`);
    const hid = ls.get("rj_ref_hide", ["name"]);
    setHTML($("#rfColPick", pane), COLS_ALL.map(([k, l]) => `<label class="check"><input type="checkbox" value="${k}" ${hid.includes(k) ? "" : "checked"}>${l}</label>`).join("") + `<div class="small muted">隱藏的欄位資料仍會保留</div>`);
    const l = filtered();
    $("#rfCount", pane).textContent = `共 ${all.length} 則，篩選 ${l.length} 則`;
    $("#rfDel", pane).disabled = !l.length;
    reload();
  }
  build();
  return {
    update: render,
    dirty: () => !!G?.changes().n || !!$$(".crit-card.chg", pane).length,
    async canLeave() {
      if ($$(".crit-card.chg", pane).length && !await confirmDialog("審查指標有尚未儲存的修改，確定離開？", { ok: "離開", danger: true })) return false;
      return guard();
    }
  };
};

const fmtDTs = ms => { if (!ms) return "—"; const d = new Date(ms); return `${fmtDT(ms)}:${pad2(d.getSeconds())}`; };
/** 產生一筆操作紀錄（放進同一個 batch，與資料同時寫入） */
function auditOp(act, o = {}) {
  const cat = o.catId ? catOf(o.catId) : null, en = o.entryId ? S.entries.find(e => e.id === o.entryId) : null;
  const str = v => v == null ? "" : String(v).slice(0, 2000);
  return { op: "set", c: "audit", id: B.newId("audit"), d: {
    at: Date.now(), uid: S.user.uid, name: S.me?.name || S.user.username || "", role: S.role, act,
    catId: o.catId || "", catName: cat?.name || o.catName || "", entryId: o.entryId || "",
    entryLabel: en ? `${en.code} ${en.org}${en.name ? "／" + en.name : ""}` : (o.entryLabel || ""),
    targetUid: o.targetUid || "", targetName: o.targetName || "", from: str(o.from), to: str(o.to), detail: str(o.detail) } };
}
const audit = (act, o) => B.batch([auditOp(act, o)]).catch(e => console.warn("audit", e));

/* ---------- 一鍵備份 ---------- */
async function exportBackup(silent) {
  const done = busy("正在整理全部資料…");
  try {
    await Promise.all([loadScript(LIB.jszip), loadScript(LIB.xlsx)]);
    const data = {};
    for (const c of ["categories", "entries", "scores", "comments", "submissions", "results", "judges", "admins", "refs", "templates", "audit"]) { done.set(`讀取資料：${c}…`); data[c] = await B.list(c); }
    data.config = { main: await B.get("config", "main"), public: await B.get("config", "public") };
    const meta = { app: "閱讀績優評選平台", format: 1, exportedAt: Date.now(), exportedBy: S.me?.name || "", title: S.cfg?.title || "" };
    const X = window.XLSX, wb = X.utils.book_new(), zip = new window.JSZip();
    const catN = id => data.categories.find(c => c.id === id)?.name || "", jN = id => data.judges.find(j => j.id === id)?.name || data.comments.find(c => c.judgeUid === id)?.judgeName || id;
    const ent = id => data.entries.find(e => e.id === id) || {};
    const cats = sortBy(data.categories, "order");
    const add = (name, head, rows, w) => { const ws = X.utils.aoa_to_sheet([head, ...rows]); ws["!cols"] = w.map(x => ({ wch: x })); X.utils.book_append_sheet(wb, ws, name); };
    done.set("產生 Excel…");
    add("類別設定", ["排序", "類別名稱", "欄位型態", "第一欄", "第二欄", "編號前綴", "備註", "獎項與名額", "評分委員", "審查指標"],
      cats.map((c, i) => [i + 1, c.name, c.layout === "double" ? "雙欄" : "單欄", c.col1Label || "", c.col2Label || "", c.codePrefix || "", c.note || "", (c.awards || "").replace(/\n/g, "；"), (c.scorers || []).map(jN).join("、") || "全部委員", c.criteria || ""]), [6, 22, 8, 10, 12, 8, 30, 18, 20, 40]);
    const ents = cats.flatMap(c => sortBy(data.entries.filter(e => e.catId === c.id), "order"));
    add("參賽名單", ["類別", "編號", "學校／機關學校", "團體名稱／姓名", "送審資料連結"], ents.map(e => [catN(e.catId), e.code, e.org, e.name || "", e.link || ""]), [22, 10, 24, 18, 40]);
    const ord = e => [cats.findIndex(c => c.id === e.catId), e.order || 0];
    const byEnt = (a, b) => { const x = ord(ent(a.entryId)), y = ord(ent(b.entryId)); return x[0] - y[0] || x[1] - y[1]; };
    add("評分明細", ["類別", "編號", "學校", "委員", "分數", "最後修改時間"], data.scores.slice().sort(byEnt).map(s => [catN(s.catId), ent(s.entryId).code || "", ent(s.entryId).org || "（已刪除）", jN(s.judgeUid), s.score, fmtDTs(s.updatedAt)]), [22, 10, 24, 12, 6, 20]);
    add("審查意見", ["類別", "編號", "學校", "委員", "序號", "內容", "建立時間", "最後修改時間"], (() => {
      const out = [], g = {}; data.comments.slice().sort((a, b) => byEnt(a, b) || String(a.judgeUid).localeCompare(b.judgeUid) || (a.order || 0) - (b.order || 0)).forEach(c => { const k = c.entryId + c.judgeUid; g[k] = (g[k] || 0) + 1; out.push([catN(c.catId), ent(c.entryId).code || "", ent(c.entryId).org || "（已刪除）", c.judgeName || jN(c.judgeUid), g[k], c.text, fmtDTs(c.createdAt), fmtDTs(c.updatedAt)]); }); return out; })(), [22, 10, 24, 12, 6, 60, 20, 20]);
    add("送出狀態", ["委員", "類別", "狀態", "送出時間", "解鎖時間"], data.submissions.map(s => [jN(s.judgeUid), catN(s.catId), s.submitted ? "已送出" : "已解鎖", fmtDTs(s.at), s.unlockedAt ? fmtDTs(s.unlockedAt) : ""]), [12, 22, 8, 20, 20]);
    add("評定結果", ["類別", "名次", "編號", "學校", "團體名稱／姓名", "平均", "等第", "備註", "鎖定"], cats.flatMap(c => { const fd = finalData(c.id); if (!fd) return [];
      return fd.list.map(r => [c.name, r.pos || "", r.e.code, r.e.org, r.e.name || "", fmtAvg(r.avg), r.award || "", r.note || "", fd.res?.locked ? `已鎖定 ${fmtDTs(fd.res.lockedAt)}` : ""]); }), [22, 6, 10, 24, 18, 8, 10, 30, 22]);
    add("委員帳號", ["姓名", "帳號", "角色", "啟用", "可評類別", "電子簽名", "建立時間"], [...data.admins.map(a => [a.name, a.username, "管理者", "是", "—", "—", fmtDTs(a.createdAt)]),
      ...sortBy(data.judges, "createdAt").map(j => [j.name, j.username, "評審委員", j.enabled ? "是" : "否", (j.categories || []).length ? j.categories.map(catN).join("、") : "全部類別", j.signature ? "有" : "無", fmtDTs(j.createdAt)])], [12, 16, 10, 6, 30, 8, 20]);
    add("操作紀錄", ["時間", "人員", "角色", "動作", "類別", "對象", "變更前", "變更後", "說明"], sortBy(data.audit, "at").map(x => [fmtDTs(x.at), x.name, x.role === "admin" ? "管理者" : "委員", (ACT[x.act] || [x.act])[0], x.catName, x.entryLabel || x.targetName || "", x.from, x.to, x.detail]), [20, 12, 8, 12, 20, 24, 30, 30, 30]);
    zip.file("原始資料.xlsx", X.write(wb, { bookType: "xlsx", type: "array" }));
    zip.file("備份資料.json", JSON.stringify({ meta, ...data }, null, 1));
    zip.file("說明.txt", [`${meta.title}`, `匯出時間：${fmtDTs(meta.exportedAt)}`, `匯出者：${meta.exportedBy}`, "",
      `類別 ${data.categories.length}、參賽 ${data.entries.length}、評分 ${data.scores.length}、意見 ${data.comments.length}、送出 ${data.submissions.length}、評定 ${data.results.length}、委員 ${data.judges.length}、操作紀錄 ${data.audit.length} 筆`,
      "", "原始資料.xlsx：供人工查閱、列印與查核。", "備份資料.json：完整資料（含電子簽名），供技術人員還原或保存。"].join("\r\n"));
    done.set("壓縮中…");
    const d = new Date(), stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    download(await zip.generateAsync({ type: "blob", compression: "DEFLATE" }), safeName(`${yearTag()}閱讀評選_完整備份_${stamp}`) + ".zip");
    await audit("backup", { detail: `類別 ${data.categories.length}、評分 ${data.scores.length}、意見 ${data.comments.length}、紀錄 ${data.audit.length}` });
    if (!silent) toast("完整備份已下載", "ok");
    return true;
  } catch (e) { console.error(e); toast("備份失敗：" + errMsg(e), "error"); return false; } finally { done(); }
}

/* ---------- 年度沿用 ---------- */
async function rollover({ year, title, keepE, keepJ, keepS, clearSig, toRefs, toTpl }) {
  const done = busy("正在建立新年度…");
  try {
    const ops = toRefs ? refImportOps(refsFromCurrent()) : [];
    if (toTpl) { const nm = `${curYear()}年度範本`, ex = (S.templates || []).find(t => t.name === nm), now = Date.now();
      ops.push({ op: "set", c: "templates", id: ex?.id || B.newId("templates"), d: { name: nm, year: curYear(), note: "年度沿用時自動保存", builtin: false, cats: bookToTpl(currentBook()), createdAt: ex?.createdAt || now, updatedAt: now } }); }
    S.scores.forEach(x => ops.push({ op: "delete", c: "scores", id: x.id }));
    S.comments.forEach(x => ops.push({ op: "delete", c: "comments", id: x.id }));
    S.subs.forEach(x => ops.push({ op: "delete", c: "submissions", id: x.id }));
    S.results.forEach(x => ops.push({ op: "delete", c: "results", id: x.id }));
    if (!keepE) S.entries.forEach(x => ops.push({ op: "delete", c: "entries", id: x.id }));
    if (!keepJ) S.judges.forEach(x => ops.push({ op: "delete", c: "judges", id: x.id }));
    else if (clearSig) S.judges.filter(j => j.signature).forEach(j => ops.push({ op: "update", c: "judges", id: j.id, d: { signature: null } }));
    if (!keepJ || !keepS) S.cats.filter(c => (c.scorers || []).length).forEach(c => ops.push({ op: "update", c: "categories", id: c.id, d: { scorers: [], scorerNames: [] } }));
    const now = Date.now(), cfg = { ...S.cfg }; delete cfg.id;
    const st = (cfg.shortTitle || "").replace(/^\d+年度/, year + "年度");
    ops.push({ op: "set", c: "config", id: "main", d: { ...cfg, title, shortTitle: st || "", isOpen: false, peerView: "off", openAt: now, closeAt: now + 7 * 864e5, updatedAt: now } });
    ops.push({ op: "set", c: "config", id: "public", d: { title, subtitle: cfg.subtitle || DEFAULT_SUB } });
    ops.push(auditOp("rollover", { detail: `開始 ${year} 年度：刪除評分 ${S.scores.length}、意見 ${S.comments.length}；名單${keepE ? "保留" : "清空"}；委員${keepJ ? "保留" : "移除"}` }));
    await W(B.batch(ops), `已開始 ${year} 年度。請到「評選設定」設定開放時間，並更新參賽名單。`);
  } catch (e) { console.error(e); } finally { done(); }
}

(async function boot() {
  // LINE 內建瀏覽器無法下載檔案：自動改用手機預設瀏覽器開啟
  if (/\bLine\//i.test(navigator.userAgent) && !/openExternalBrowser=1/.test(location.search)) {
    location.replace(location.pathname + (location.search ? location.search + "&" : "?") + "openExternalBrowser=1" + location.hash); return;
  }
  try {
    B = DEMO ? makeDemo() : await makeFirebase();
    if (!DEMO) { B.watchDoc("config", "public", d => { S.pub = d; if (current?.name === "login") { const h = $(".auth-card h1"); if (h && d?.title) h.textContent = d.title; } }, () => {}); }
    else S.pub = { title: DEFAULT_TITLE, subtitle: DEFAULT_SUB };
    let first = true;
    B.onAuth(async u => {
      if (S.bootstrapping) return;
      if (u) { if (S.user?.uid === u.uid && S.role) return; await startSession(u); }
      else if (S.role) { doLogout(); }
      else {
        if (first) { const ok = await B.isSetupDone().catch(() => true); mountView(ok ? "login" : "setup", {}); }
        else if (current?.name !== "login" && current?.name !== "setup") mountView("login", {});
      }
      first = false;
    });
  } catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="auth-page"><div class="auth-card"><h1>系統載入失敗</h1><p class="sub">${esc(e.message)}</p><p class="small muted">請確認網路連線，或檢查 Firebase 設定是否正確。</p><button class="btn primary" onclick="location.reload()">重新整理</button></div></div>`;
  }
})();
</script>
</body>
</html>
